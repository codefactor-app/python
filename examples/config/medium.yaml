# Python: повседневный анализ без привязки к фреймворку.
# Пороги можно адаптировать под проект.
config_version: 1
languages:
  enabled: [python]
paths:
  include: ["**"] # Все поддерживаемые файлы выбранного языка, включая корневые.
  exclude:
    # Тесты и фикстуры pytest и unittest. Globs чувствительны к регистру.
    - "**/test/**"
    - "**/tests/**"
    - "**/test_*.py"
    - "**/*_test.py"
    - "**/conftest.py"
    - "**/fixtures/**"
    # Сгенерированный код, миграции, артефакты сборки и окружений.
    - "**/generated/**"
    - "**/*_pb2.py"
    - "**/*_pb2_grpc.py"
    - "**/migrations/**"
    - "**/__pycache__/**"
    - "build/**"
    - "dist/**"
    - ".tox/**"
    - ".nox/**"
    - "docs/conf.py" # Конфигурация Sphinx.
    # Каталоги фреймворков смотрите в django.yaml и fastapi.yaml.
vendor:
  # Список заменяет defaults движка; site-packages покрывает любые окружения.
  paths: [".venv/**", "venv/**", "**/site-packages/**", "vendor/**", "node_modules/**"]
  mode: collapsed
  parse: lazy # none запрещает раскрытие зависимостей; full разбирает сразу.
limits:
  # Первые шесть порогов совпадают с defaults движка и приведены для настройки.
  file_lines: {warn: 400, error: 800}
  function_lines: {warn: 40, error: 100}
  functions_per_file: {warn: 20, error: 40}
  methods_per_class: {warn: 15, error: 30}
  function_params: {warn: 4, error: 7}
  cyclomatic_complexity: {warn: 10, error: 20}
  # Структурные пороги. Несколько классов в модуле для Python норма, поэтому
  # types_per_file не задан; цикл между модулями попадает в отчёт
  # и блокирует CI только с --fail-on-warn.
  nesting_depth: {warn: 4, error: 6}
  cognitive_complexity: {warn: 15, error: 30}
  module_cycle: {warn: 0}
architecture:
  enabled: true
  profile: strict
cache:
  enabled: true
  path: .analyzer-cache
output:
  formats: [console] # Для машинного stdout замените на [json].
