[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "codefactor"
version = "0.1.2"
description = "Codefactor CLI for Python environments, with an optional Python API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
codefactor = "codefactor._cli:main"

[project.urls]
Repository = "https://gitlab.local/codefactor/python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codefactor = ["release.json", "certs/*.pem", "bin/*", "py.typed"]

[tool.setuptools.data-files]
"share/codefactor/examples" = ["examples/README.md"]
"share/codefactor/examples/config" = ["examples/config/*.yaml"]
"share/codefactor/docs" = ["docs/configuration.md"]
